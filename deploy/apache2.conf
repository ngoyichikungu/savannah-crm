# Apache2 VirtualHost configuration for Savannah CRM & Business Operations
<VirtualHost *:80>
    ServerName crm.example.co.zm
    ServerAdmin webmaster@example.co.zm
    DocumentRoot /var/www/savannah-crm/dist

    <Directory /var/www/savannah-crm/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Single Page Application routing fallback
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
        </IfModule>
    </Directory>

    # Security: Deny access to sensitive files and database snapshots
    <FilesMatch "^\.|\.(sql|mysql|sqlite|env|lock)$">
        Require all denied
    </FilesMatch>

    # Security Headers
    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    # Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain text/css application/json application/javascript text/xml application/xml
    </IfModule>

    # Static assets caching
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/savannah_error.log
    CustomLog ${APACHE_LOG_DIR}/savannah_access.log combined
</VirtualHost>
