# Nginx server configuration for Savannah CRM & Business Operations
server {
    listen 80;
    listen [::]:80;
    server_name crm.example.co.zm;
    root /var/www/savannah-crm/dist;

    index index.html;

    # Gzip compression for fast asset transfer
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Maximum upload size for company logos and document attachments
    client_max_body_size 25M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve static assets with cache headers
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy or Single Page Application fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden dotfiles and SQL database files
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location ~ \.(sql|mysql|sqlite)$ {
        deny all;
    }
}
